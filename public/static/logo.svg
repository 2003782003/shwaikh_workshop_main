<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gear -->
  <g transform="translate(256 256)">
    <g fill="url(#metal)">
      <circle r="110"/>
      <g>
        <rect x="-22" y="-155" width="44" height="50" rx="6"/>
        <rect x="-22" y="105" width="44" height="50" rx="6"/>
        <rect x="-155" y="-22" width="50" height="44" rx="6"/>
        <rect x="105" y="-22" width="50" height="44" rx="6"/>
      </g>
      <g transform="rotate(45)">
        <rect x="-22" y="-155" width="44" height="50" rx="6"/>
        <rect x="-22" y="105" width="44" height="50" rx="6"/>
        <rect x="-155" y="-22" width="50" height="44" rx="6"/>
        <rect x="105" y="-22" width="50" height="44" rx="6"/>
      </g>
    </g>
    <circle r="55" fill="#0f172a"/>
    <!-- Wrench inside -->
    <g stroke="#60a5fa" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(-30)">
      <path d="M-35 -20 L30 35"/>
      <circle cx="-38" cy="-22" r="12"/>
      <circle cx="33" cy="37" r="12"/>
    </g>
  </g>
  <!-- Arabic text ش -->
  <text x="256" y="460" text-anchor="middle" font-family="Cairo, sans-serif" font-size="52" font-weight="800" fill="#ffffff">ورشة شويخ</text>
</svg>
